name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    runs-on: macos-26

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository
      contents: write

    env:
      FRAMEWORK_FILENAME: LibXrayGo.xcframework
      GOMOBILE_TARGETS: ios,iossimulator,macos,maccatalyst,appletvos,appletvsimulator,xros,xrsimulator

    steps:
      - uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
        
      - name: Setup Gomobile
        run: |
          git clone https://go.googlesource.com/mobile /tmp/mobile
          pushd /tmp/mobile
          git apply ${{ github.workspace }}/patches/gomobile.patch
          go build -o gomobile ./cmd/gomobile
          chmod +x gomobile
          popd
          export PATH=/tmp/mobile/:$PATH
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Read package platform versions
        run: |
            IOS_VERSION=$(perl -0ne 'print "$1.0" if /\.iOS\(\.v([0-9]+)\)/' Package.swift)
            MACOS_VERSION=$(perl -0ne 'print "$1.0" if /\.macOS\(\.v([0-9]+)\)/' Package.swift)
            TVOS_VERSION=$(perl -0ne 'print "$1.0" if /\.tvOS\(\.v([0-9]+)\)/' Package.swift)
            XROS_VERSION=$(perl -0ne 'print "$1.0" if /\.visionOS\(\.v([0-9]+)\)/' Package.swift)
            test -n "$IOS_VERSION"
            test -n "$MACOS_VERSION"
            test -n "$TVOS_VERSION"
            test -n "$XROS_VERSION"
            echo "IOS_VERSION=$IOS_VERSION" >> $GITHUB_ENV
            echo "MACOS_VERSION=$MACOS_VERSION" >> $GITHUB_ENV
            echo "TVOS_VERSION=$TVOS_VERSION" >> $GITHUB_ENV
            echo "XROS_VERSION=$XROS_VERSION" >> $GITHUB_ENV

      - name: Build xcframework
        run: |
            gomobile init
            gomobile bind -target "$GOMOBILE_TARGETS" -iosversion="$IOS_VERSION" -macosversion="$MACOS_VERSION" -tvosversion="$TVOS_VERSION" -xrosversion="$XROS_VERSION" -x -o "$FRAMEWORK_FILENAME"

      - name: Archive xcframework
        run: zip -r ${{ env.FRAMEWORK_FILENAME }}.zip ${{ env.FRAMEWORK_FILENAME }}

      - name: Fix up Package.swift
        run: |
            export TEMP=`shasum -a 256 ${{ env.FRAMEWORK_FILENAME }}.zip`
            export CHECKSUM=${TEMP:0:64}
            cd Template
            sed -i ".bak" "s/VERSION/${{ github.event.inputs.version }}/g" Package.template
            sed -i ".bak" "s/CHECKSUM/${CHECKSUM}/g" Package.template
            sed -i ".bak" "s/FRAMEWORK_FILENAME/${{ env.FRAMEWORK_FILENAME }}.zip/g" Package.template
            cd ..
            cp ./Template/Package.template Package.swift

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
            commit_message: XrayKit Release ${{ github.event.inputs.version }}
            commit_user_name: GitHub Actions Bot
            commit_user_email: thomas.veerman@wanwire.net
            commit_author: Thomas Veerman <thomas.veerman@wanwire.net>
            commit_options: '--no-verify --signoff'
            tagging_message: ${{ github.event.inputs.version }}
            file_pattern: 'Package.swift'

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.event.inputs.version }}
          files: ${{ env.FRAMEWORK_FILENAME }}.zip
